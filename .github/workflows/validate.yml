name: validate-data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrity check
        run: python3 tools/validate.py data
      - name: Validator self-test (defects must be caught)
        run: python3 -m unittest discover -s tools -v
      - name: Rebuild index and report
        run: python3 tools/build_index.py
      - name: Generated files must be committed
        run: git diff --exit-code -- dist docs/VALIDATION_REPORT.md
