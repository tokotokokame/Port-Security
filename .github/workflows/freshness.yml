name: data-freshness

# Weekly check that the committed primary data (IANA, ATT&CK, CVE, KEV) is still current.
# Fails (and therefore notifies the owner) when an official source has changed; it never commits.
on:
  schedule:
    - cron: "17 21 * * 0"   # Monday 06:17 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare with official sources
        shell: bash   # -eo pipefail: a stale source must fail the job even through tee
        run: python3 tools/freshness.py --links | tee -a "$GITHUB_STEP_SUMMARY"
