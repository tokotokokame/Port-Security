name: refresh-iana

# Fetches the official IANA registries (ports, IP protocol numbers) and commits them under data/raw/iana/.
# Runs automatically on a feature branch that lacks a file, or on demand.
on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download registry
        id: dl
        if: >-
          github.event_name == 'workflow_dispatch' ||
          hashFiles('data/raw/iana/service-names-port-numbers.csv') == '' ||
          hashFiles('data/raw/iana/protocol-numbers-1.csv') == ''
        run: |
          mkdir -p data/raw/iana
          curl -fsSL --retry 3 -o data/raw/iana/service-names-port-numbers.csv \
            https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.csv
          head -1 data/raw/iana/service-names-port-numbers.csv | grep -q "^Service Name,Port Number,Transport Protocol"
          curl -fsSL --retry 3 -o data/raw/iana/protocol-numbers-1.csv \
            https://www.iana.org/assignments/protocol-numbers/protocol-numbers-1.csv
          head -1 data/raw/iana/protocol-numbers-1.csv | grep -q "^Decimal,Keyword,Protocol"
          date -u +%Y-%m-%d > data/raw/iana/FETCHED_AT
          wc -l data/raw/iana/*.csv
      - name: Commit if changed
        if: steps.dl.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/iana
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Data: IANA 登録台帳（ポート・IP プロトコル番号）を取得 ($(cat data/raw/iana/FETCHED_AT))"
          git push
