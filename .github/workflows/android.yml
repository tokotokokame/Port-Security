name: android-app

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      # First run only: generate android/ and commit it back to the feature branch.
      - name: Bootstrap Android platform files
        if: hashFiles('app/android/app/build.gradle.kts', 'app/android/app/build.gradle') == '' && github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          flutter create --platforms=android --org com.tokotokokame --project-name port_security .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Chore: flutter create で android/ を生成"
          git push

      - run: flutter pub get

      - name: Bundled data must match dist/
        working-directory: .
        run: |
          python3 tools/build_index.py
          git diff --exit-code -- app/assets/data dist

      - run: flutter analyze

      - run: flutter test

      - name: Prepare release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signing: release keystore"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 未設定のためデバッグ鍵で署名します"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Security check of the built APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          echo "== permissions"; "$AAPT2" dump permissions "$APK" | tee perms.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep -E "allowBackup|exported|usesCleartextTraffic|debuggable|<activity|<service|<receiver|<provider" -n manifest.txt || true
          if grep -q "android.permission.INTERNET" perms.txt; then echo "::error::INTERNET permission found"; exit 1; fi
          if grep -q "debuggable.*=true" manifest.txt; then echo "::error::debuggable release"; exit 1; fi
          if grep -A3 "allowBackup" manifest.txt | grep -q "(type 0x12)0xffffffff"; then echo "::error::allowBackup=true"; exit 1; fi
          ls -la "$APK"; sha256sum "$APK" | tee apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: port-security-apk
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/apk.sha256

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk "port-security-$TAG.apk"
          gh release create "$TAG" "port-security-$TAG.apk" --target "$GITHUB_SHA" --latest \
            --title "Port Security $TAG" \
            --notes "Android用APK。SHA-256: $(cut -d' ' -f1 app/apk.sha256)"
