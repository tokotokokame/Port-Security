name: android-app

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 暫定措置: 正式署名の Secrets 登録までは、main でもデバッグ署名で公開する（リリース名に明記）。
# Secrets を登録すると自動で正式署名に切り替わる。登録後は "false" に戻すこと（docs/RELEASE_SIGNING.md）。
env:
  ALLOW_DEBUG_RELEASE: "true"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      # First run only: generate android/ and commit it back to the feature branch.
      - name: Bootstrap Android platform files
        if: hashFiles('app/android/app/build.gradle.kts', 'app/android/app/build.gradle') == '' && github.ref != 'refs/heads/main' && github.event_name == 'push'
        run: |
          flutter create --platforms=android --org com.tokotokokame --project-name port_security .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "Chore: flutter create で android/ を生成"
          git push

      - run: flutter pub get

      - name: Data quality gate (no release on bad data)
        working-directory: .
        run: |
          pip install -q -r tools/requirements.txt
          rc=0
          python3 tools/validate.py data || rc=1
          python3 tools/quality.py || rc=1
          exit $rc

      - name: Bundled data must match dist/
        working-directory: .
        run: |
          python3 tools/build_index.py
          git diff --exit-code -- app/assets/data dist

      - run: flutter analyze

      - run: flutter test

      # F-07: main（正式リリース）は正式な署名鍵が必須。Secrets が欠けていれば失敗し、リリースしない。
      # PR・feature ブランチは検証用にデバッグ鍵で署名してよいが、リリースは作らない。
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          missing=""
          for v in KEYSTORE_B64 KS_PASS KEY_ALIAS KEY_PASS; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -z "$missing" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"; echo "signing: release keystore"
          elif [ "$IS_RELEASE" = "true" ] && [ "$ALLOW_DEBUG_RELEASE" != "true" ]; then
            echo "::error::正式署名の Secrets が未登録（${missing# }）のため、リリース用ビルドを中止します。docs/RELEASE_SIGNING.md を参照"
            exit 1
          else
            echo "SIGNING=debug" >> "$GITHUB_ENV"
            echo "::warning::正式署名の Secrets 未登録のため、デバッグ鍵で署名します（main は ALLOW_DEBUG_RELEASE=true の場合のみ暫定公開）"
          fi
          [ "$IS_RELEASE" = "true" ] && [ -z "$missing" ] && echo "REQUIRE_RELEASE_SIGNING=1" >> "$GITHUB_ENV" || true

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Security check of the built APK
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          echo "== permissions"; "$AAPT2" dump permissions "$APK" | tee perms.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          python3 ../tools/check_manifest.py manifest.txt perms.txt
          for f in build/app/outputs/flutter-apk/*-release.apk; do ls -la "$f"; done
          (cd build/app/outputs/flutter-apk && sha256sum *-release.apk) | tee apk.sha256

      - name: Signing certificate check
        run: |
          set -o pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in build/app/outputs/flutter-apk/*-release.apk; do "$APKSIGNER" verify --verbose --print-certs "$f" > "$f.certs"; done
          python3 ../tools/check_signing.py --require "${SIGNING}" --pin ../docs/signing/release-cert.sha256 build/app/outputs/flutter-apk/*-release.apk.certs | tee signing.txt

      - uses: actions/upload-artifact@v6
        with:
          name: port-security-apk
          path: |
            app/build/app/outputs/flutter-apk/*-release.apk
            app/apk.sha256
            app/signing.txt

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          OUT=app/build/app/outputs/flutter-apk
          cp $OUT/app-arm64-v8a-release.apk "port-security-$TAG-arm64.apk"
          cp $OUT/app-armeabi-v7a-release.apk "port-security-$TAG-armv7.apk"
          # 正式署名でないものは公開しない（暫定措置 ALLOW_DEBUG_RELEASE=true の場合を除く）
          if [ "$SIGNING" = "release" ]; then SUFFIX=""; NOTE="署名証明書 SHA-256: \`CERT_PH\`（docs/signing/release-cert.sha256 と同じであることを確認してください）"
          elif [ "$ALLOW_DEBUG_RELEASE" = "true" ]; then SUFFIX="（デバッグ署名・暫定）"; NOTE="⚠ 暫定版: デバッグ鍵で署名しています（鍵はビルドごとに異なります）。更新時は一度アンインストールしてからインストールしてください。証明書 SHA-256: \`CERT_PH\`"
          else exit 1; fi
          sha256sum port-security-$TAG-*.apk > SHA256SUMS.txt
          CERT=$(grep -m1 '^certificate_sha256=' app/signing.txt | cut -d= -f2)
          printf '%s\n\n%s\n\n%s\n\n```\n%s\n```\n' \
            "通常のスマホは **arm64** 版をダウンロードしてください（古い32bit端末のみ armv7 版）。" \
            "提供元不明のアプリのインストール許可が必要です。" \
            "${NOTE//CERT_PH/$CERT}" "$(cat SHA256SUMS.txt)" > notes.md
          gh release create "$TAG" port-security-$TAG-*.apk SHA256SUMS.txt --target "$GITHUB_SHA" --latest \
            --title "Port Security $TAG$SUFFIX" --notes-file notes.md
